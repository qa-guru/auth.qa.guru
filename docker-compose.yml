# Keycloak IdP — auth.qa.guru (phase 11.qa-guru-identity, P2a)
# PostgreSQL is native systemd on the host, not this compose: docker-published
# ports bypass ufw (load-sut graze). Host network + HTTP bind 127.0.0.1 so ufw
# actually governs 80/443. Secrets come from /etc/keycloak/keycloak.env (root 600).
# Realm JSON is copied at install from the monorepo wrapper's dev/realm/.

name: auth-qa-guru

services:
  keycloak:
    build: .
    image: auth-qa-guru-keycloak:26.7.3
    network_mode: host
    env_file:
      - /etc/keycloak/keycloak.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://auth.qa.guru
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: "127.0.0.1"
      KC_HTTP_PORT: "8080"
      KC_HTTP_MANAGEMENT_HOST: "127.0.0.1"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_WEBAUTHN_RP_ID: qa.guru
      JAVA_OPTS_APPEND: -Dkeycloak.migration.replace-placeholders=true
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
